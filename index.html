  <body>
    <div id="app"></div>
    <div id="zario-boot-guard" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:110000;background:linear-gradient(155deg,#132450,#0b112a);color:#fff;padding:20px;font-family:system-ui,sans-serif">
      <div style="max-width:410px;text-align:center">
        <div style="font-size:44px;font-weight:950;letter-spacing:-3px;color:#ffcc38;text-shadow:0 4px 0 #e05c39">ZARIO KART</div>
        <div id="zario-boot-message" style="margin:16px 0 12px;font-size:16px;font-weight:700">Loading the race track…</div>
        <div id="zario-boot-details" style="font-size:12px;color:#b8ceef;line-height:1.65"></div>
        <a id="zario-safe-link" href="?quality=low&amp;nobl=1" style="display:none;margin-top:18px;background:#ffcc38;color:#10204b;padding:12px 18px;border-radius:20px;font-weight:800;text-decoration:none">TRY SAFE GRAPHICS</a>
      </div>
    </div>
    <script>
      (function () {
        var msg = document.getElementById('zario-boot-message');
        var detail = document.getElementById('zario-boot-details');
        var safe = document.getElementById('zario-safe-link');
        var ready = false;
        function report(reason) {
          if (ready) return;
          msg.textContent = 'The game could not start';
          detail.textContent = reason + ' · Try Safe Graphics, then refresh if needed.';
          safe.style.display = 'inline-block';
        }
        window.addEventListener('error', function (e) {
          if (e.message) report(String(e.message).slice(0, 180));
          else if (e.target && e.target.tagName === 'SCRIPT') report('JavaScript file failed to load');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          report(String(e.reason && e.reason.message || e.reason || 'Game startup failed').slice(0,180));
        });
        var started = Date.now();
        var interval = setInterval(function () {
          if (window.__zarioControlStatus && document.querySelector('#app canvas')) {
            ready = true;
            document.getElementById('zario-boot-guard')?.remove();
            clearInterval(interval);
          } else if (Date.now() - started > 18000) {
            report('Loading timed out on this browser');
            clearInterval(interval);
          }
        }, 300);
      }());
    </script>
  </body>
