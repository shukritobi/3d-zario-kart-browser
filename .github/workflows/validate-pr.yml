name: Validate Zario Kart feature branches
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit regression tests
        run: node --test tests/unit/*.test.mjs
      - name: Build for Safari 13, Chrome and Samsung TV
        run: npm run build
